<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW-WIN · DRUG DISCOVERY LOGIC ENGINE v103.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #0a0c10; color: #e6edf3; font-family: 'Inter', sans-serif; font-size: 13px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 1.5rem; transition: 0.3s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { border-color: #2ea44f; }
        .input-field { background: #0d1117; border: 1px solid #3b434b; color: #2ea44f; padding: 0.4rem 0.8rem; border-radius: 0.75rem; width: 90px; text-align: center; font-weight: bold; outline: none; }
        .btn { background: #2ea44f; color: black; font-weight: 800; padding: 0.75rem; border-radius: 1rem; transition: 0.2s; border: none; cursor: pointer; text-transform: uppercase; width: 100%; }
        .btn:hover { background: #3fb950; box-shadow: 0 0 15px #2ea44f; }
        .result-box { background: #0d1117; padding: 1rem; border-radius: 1rem; border: 1px solid #30363d; min-height: 45px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .section-title { color: #2ea44f; font-weight: 900; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 1rem; border-left: 3px solid #2ea44f; padding-left: 8px; }
        .label-text { font-size: 10px; font-weight: 700; color: #8b949e; text-transform: uppercase; }
        .watermark { text-align: center; margin-top: 2rem; font-size: 10px; color: #30363d; letter-spacing: 2px; font-weight: bold; }
        .insight-item { border-bottom: 1px solid #21262d; padding: 4px 0; }
        .opt-suggest { color: #f2cc60; margin-top: 8px; font-weight: 700; border-top: 1px dashed #3b434b; padding-top: 8px; }
    </style>
</head>
<body class="p-6">

<div class="max-w-[1400px] mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-black tracking-tighter uppercase"> GROW-WIN <span class="text-[#2ea44f]">Pharma Engine</span></h1>
        <p class="text-xs text-gray-500 mt-1 tracking-widest uppercase">v103.0 · Multi-Target Industrial Logic Pathway</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
        <div class="card p-5">
            <h2 class="section-title">1. Docking</h2>
            <div class="space-y-3">
                <div class="flex flex-col"><label class="label-text">Target Type</label>
                    <select id="targetType" class="input-field !w-full text-[10px]">
                        <option value="generic">0. GENERIC</option>
                        <option value="oncology">1. ONCOLOGY</option>
                        <option value="anti-infective">2. ANTI-INFECTIVE</option>
                        <option value="antiviral">3. ANTIVIRAL</option>
                        <option value="antibacterial">4. ANTIBACTERIAL</option>
                        <option value="antifungal">5. ANTIFUNGAL</option>
                        <option value="cns">6. CNS (NEURO)</option>
                        <option value="cardio">7. CARDIOVASCULAR</option>
                        <option value="metabolic">8. METABOLIC</option>
                        <option value="immuno">9. IMMUNOLOGY</option>
                        <option value="inflam">10. INFLAMMATION</option>
                        <option value="resp">11. RESPIRATORY</option>
                        <option value="gi">12. GASTROINTESTINAL</option>
                        <option value="derma">13. DERMATOLOGY</option>
                        <option value="hormonal">14. HORMONAL</option>
                        <option value="autoimmune">15. AUTOIMMUNE</option>
                        <option value="neurodeg">16. NEURODEGENERATIVE</option>
                        <option value="pain">17. PAIN/ANALGESIC</option>
                        <option value="parasitic">18. ANTIPARASITIC</option>
                        <option value="vaccine">19. VACCINE</option>
                    </select>
                </div>
                <div class="flex justify-between items-center"><label class="label-text">Affinity (kcal/mol)</label><input id="affinity" type="number" step="0.1" class="input-field" placeholder="0.0"></div>
                <div class="flex justify-between items-center"><label class="label-text">RMSD (Å)</label><input id="rmsd" type="number" step="0.1" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">Rot. Bonds</label><input id="rotBonds" type="number" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">LogP</label><input id="logP" type="number" step="0.1" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">Mol Weight</label><input id="mw" type="number" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">PSA (Å²)</label><input id="psa" type="number" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">logS</label><input id="logs" type="number" step="0.1" class="input-field"></div>
            </div>
        </div>

        <div class="card p-5">
            <h2 class="section-title">2. ADMET</h2>
            <div class="space-y-4">
                <div class="flex flex-col"><label class="label-text">Bioavailability %</label><input id="bio" type="number" class="input-field !w-full"></div>
                <div class="flex flex-col"><label class="label-text">Metabolic Stability %</label><input id="metStab" type="number" class="input-field !w-full"></div>
                <div class="flex flex-col"><label class="label-text">CYP Inhibition %</label><input id="cyp" type="number" class="input-field !w-full"></div>
            </div>
        </div>

        <div class="card p-5">
            <h2 class="section-title">3. Safety & Tox</h2>
            <div class="space-y-3">
                <div class="flex justify-between items-center"><label class="label-text">hERG Block %</label><input id="herg" type="number" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">CytoTox IC50 (µM)</label><input id="cyto" type="number" class="input-field"></div>
                <div class="flex justify-between items-center"><label class="label-text">DILI Risk</label><select id="dili" class="input-field"><option value="low">LOW</option><option value="high">HIGH</option><option value="critical">CRITICAL</option></select></div>
                <div class="flex justify-between items-center"><label class="label-text">Ames Test</label><select id="ames" class="input-field"><option value="neg">NEG</option><option value="pos">POS</option></select></div>
                <div class="flex justify-between items-center"><label class="label-text">Genotox</label><select id="genotox" class="input-field"><option value="0">NO</option><option value="1">YES</option></select></div>
                <div class="flex justify-between items-center"><label class="label-text">Mech Risk</label><select id="mechRisk" class="input-field"><option value="low">LOW</option><option value="thrombotic">THROMBOTIC</option></select></div>
            </div>
        </div>

        <div class="card p-5">
            <h2 class="section-title">4. FP Filters</h2>
            <div class="space-y-4">
                <div class="flex flex-col"><label class="label-text">PAINS Alert</label><select id="pains" class="input-field !w-full"><option value="0">CLEAR</option><option value="1">ALERT</option></select></div>
                <div class="flex flex-col"><label class="label-text">Aggregation Risk %</label><input id="agg" type="number" class="input-field !w-full"></div>
            </div>
        </div>

        <div class="card p-5">
            <h2 class="section-title">5. Manufacturing</h2>
            <div class="space-y-4">
                <div class="flex flex-col"><label class="label-text">Synth Steps</label><input id="steps" type="number" class="input-field !w-full"></div>
                <div class="flex flex-col"><label class="label-text">Avg Yield %</label><input id="yield" type="number" class="input-field !w-full"></div>
                <hr class="border-gray-800 my-2">
                <button class="btn" onclick="runAll()">Run Engine</button>
            </div>
        </div>
    </div>

    <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="result-box flex-col items-start p-6 text-xs" id="logOutput">
            <span class="text-gray-500 uppercase font-black mb-2">45-Gate Industrial Sieve:</span>
            <div id="logic-log" class="w-full">Awaiting industrial parameters...</div>
            <div id="opt-log" class="w-full mt-2"></div>
        </div>
        <div class="result-box flex-col p-6 text-center">
            <div id="multiplierLabel" class="text-[10px] text-gray-500 uppercase mb-1">Risk Multiplier: 1.0x</div>
            <div class="flex items-center justify-center gap-6">
                <span id="globalScore" class="text-5xl font-black text-white">0.0</span>
                <span id="globalRank" class="text-5xl font-black text-gray-700">-</span>
            </div>
            <div id="approvalStatus" class="mt-2 text-xs font-bold uppercase text-gray-500 italic">Standby</div>
        </div>
    </div>

    <div class="watermark">DESIGNED BY UDAYANA ANANTH KUMAR</div>
</div>

<script>
    function parseInput(id, min, max, def) {
        let val = parseFloat(document.getElementById(id).value);
        return isNaN(val) ? def : val;
    }

    function getTargetRules(target) {
        let rules = { affinity: -7.0, logP_min: -1.0, logP_max: 5.0, psa_max: 140 };
        const t = target.toUpperCase();
        if (t === "METABOLIC") rules = { affinity: -6.0, logP_min: -2.5, logP_max: 3.5, psa_max: 150 };
        else if (t === "ONCOLOGY") rules = { affinity: -7.5, logP_min: -1.0, logP_max: 5.5, psa_max: 160 };
        else if (t === "CNS") rules = { affinity: -7.0, logP_min: 1.0, logP_max: 4.5, psa_max: 70 };
        else if (t.includes("ANTI-") || t.includes("ANTI")) rules = { affinity: -7.0, logP_min: -1.5, logP_max: 4.5, psa_max: 130 };
        return rules;
    }

    function runAll() {
        const targetType = document.getElementById('targetType').value;
        const rules = getTargetRules(targetType);

        const affinity = parseInput('affinity', -20, 0, 0);
        const rmsd = parseInput('rmsd', 0, 10, 0);
        const bio = parseInput('bio', 0, 100, 0);
        const logP = parseInput('logP', -5, 15, 0);
        const psa = parseInput('psa', 0, 300, 0);
        const stability = parseInput('metStab', 0, 100, 0);
        const cyp = parseInput('cyp', 0, 100, 0);
        const herg = parseInput('herg', 0, 100, 0);
        const cyto = parseInput('cyto', 0, 1000, 0);
        const diliStatus = document.getElementById('dili').value.toUpperCase();
        const ames = document.getElementById('ames').value;
        const genotox = document.getElementById('genotox').value;
        const mech = document.getElementById('mechRisk').value;
        const pains = document.getElementById('pains').value;
        const aggRisk = parseInput('agg', 0, 100, 0);

        let gateFailures = 0;
        let criticalFailures = 0;
        let riskMultiplier = 1.0;
        let log = [];
        let optSuggest = [];

        // 1. Docking Affinity
        if (affinity > rules.affinity) { 
            gateFailures++; 
            riskMultiplier *= 0.8; 
            log.push(`Gate 1: Weak Affinity (> ${rules.affinity})`); 
            optSuggest.push(`Increase Affinity to at least ${rules.affinity} kcal/mol`);
        }

        if (rmsd > 2.0) { 
            gateFailures++; 
            log.push("Gate 2: Pose Instability (RMSD > 2.0)"); 
            optSuggest.push("Minimize RMSD below 2.0 Å for better binding stability");
        }
        
        // 2. ADMET & LogP
        if (bio < 30) { 
            gateFailures++; 
            log.push("Gate 11: Poor Bioavailability (< 30%)"); 
            optSuggest.push("Improve Bioavailability above 30% for systemic efficacy");
        }
        
        if (logP < rules.logP_min || logP > rules.logP_max) { 
            gateFailures++; 
            log.push(`Gate 6: LogP Lipophilicity Out of Range`); 
            optSuggest.push(`Optimize LogP to fall between ${rules.logP_min} and ${rules.logP_max}`);
        }

        if (psa > rules.psa_max) { 
            gateFailures++; 
            log.push(`Gate 7: High PSA (> ${rules.psa_max})`); 
            optSuggest.push(`Reduce Polar Surface Area (PSA) below ${rules.psa_max} Å²`);
        }

        // 3. TOXICOLOGY (CRITICAL)
        if (herg > 10) { 
            criticalFailures++; log.push("Gate 21: CRITICAL hERG Block"); 
            optSuggest.push("CRITICAL: Reduce hERG inhibition below 10% to avoid arrhythmia");
        }
        if (diliStatus !== "LOW") { 
            criticalFailures++; log.push("Gate 23: Hepatic Risk detected"); 
            optSuggest.push("CRITICAL: Address DILI risk; change status to LOW");
        }
        if (genotox === "1" || ames === "pos") { 
            criticalFailures++; log.push("Gate 24: Mutagenicity detected"); 
            optSuggest.push("CRITICAL: Remove mutagenic structural features (Ames/Genotox)");
        }

        // Global Multiplier & Score
        if (criticalFailures > 0) riskMultiplier = 0.0;
        else if (gateFailures === 2 && riskMultiplier > 0.5) riskMultiplier = 0.5;
        else if (gateFailures === 1 && riskMultiplier > 0.8) riskMultiplier = 0.8;

        let dockingScore = Math.min(Math.max(Math.abs(affinity) * 3.5, 0), 35);
        let admetScore = (bio * 0.15) + (stability * 0.1);
        let safetyScore = Math.max(0, (40 - gateFailures) * 1.5);
        let finalScore = (dockingScore + admetScore + safetyScore) * riskMultiplier;

        let rank = "F";
        if (riskMultiplier > 0) {
            if (finalScore >= 130) rank = "A+";
            else if (finalScore >= 110) rank = "A";
            else if (finalScore >= 90) rank = "B";
            else if (finalScore >= 70) rank = "C";
            else rank = "D";
        }

        // Optimization Engine Trigger
        if (rank !== "A" && rank !== "A+" && optSuggest.length === 0) {
            if (dockingScore < 25) optSuggest.push("Boost binding affinity to reach A-Rank status");
            if (bio < 60) optSuggest.push("Higher Bioavailability will significantly raise the global score");
        }

        // UI UPDATE
        document.getElementById('globalScore').innerText = finalScore.toFixed(1);
        document.getElementById('globalRank').innerText = rank;
        document.getElementById('multiplierLabel').innerText = `Risk Multiplier: ${riskMultiplier.toFixed(2)}x`;
        
        const statusObj = document.getElementById('approvalStatus');
        statusObj.innerText = (riskMultiplier === 0) ? "REJECTED (CRITICAL)" : (finalScore > 105 ? "R&D READY" : "OPTIMIZATION REQ");
        statusObj.style.color = (riskMultiplier === 0) ? "#f85149" : "#2ea44f";

        document.getElementById('logic-log').innerHTML = log.length > 0 ? 
            log.map(l => `<div class='insight-item text-red-400'>${l}</div>`).join('') : 
            "<div class='text-green-500'>✔ ALL INDUSTRIAL GATES PASSED</div>";

        document.getElementById('opt-log').innerHTML = optSuggest.length > 0 ? 
            `<div class='opt-suggest'>PATHWAY TO A-RANK:<br>${optSuggest.map(s => `• ${s}`).join('<br>')}</div>` : "";
    }
</script>
</body>
</html>
